name: issue integration validation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/validate-issues-20261114

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/codex/validate-issues-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation-logs
          ./scripts/install-linux-deps.sh --no-prime-server 2>&1 | tee validation-logs/dependencies.log
          python -m pip install requests shapely numpy 2>&1 | tee validation-logs/python-dependencies.log
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: issue-validation-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            issue-validation-ccache-${{ runner.os }}-
      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DENABLE_DATA_TOOLS=ON -DENABLE_SERVICES=OFF -DENABLE_TESTS=ON \
            -DENABLE_PYTHON_BINDINGS=ON -DENABLE_CCACHE=ON -DLOGGING_LEVEL=ALL \
            -DENABLE_SINGLE_FILES_WERROR=OFF 2>&1 | tee validation-logs/configure.log
      - name: Build focused targets and regenerate Python stub
        id: focused_build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --target lua maneuversbuilder actor \
            factory map_matcher_factory graphtile transitdeparture gurka_gtfs multimodalbuilder \
            openlr gurka_locate predictedspeeds uniquenames gridded_data \
            restriction_parser gurka_simple_restrictions thor_worker mapmatch gurka_trace_attributes gurka_lane_connectivity \
            attributes_controller osmnode gurka_vector_tiles \
            aabb2 edgeinfo edgestatus elevation_encoding encode graphreader grid_range_query grid_traversal \
            isochrone json matrix optimizer parse_request pointll polyline2 reach sample sequence tar tilehierarchy util_odin \
            gurka_conditional_restrictions gurka_time_dependent_restrictions gurka_probable_restrictions gurka_elevation gurka_linear_feature_factors gurka_recost \
            gurka_route gurka_time_tracking gurka_use_options \
            gurka_oneways_foot_bike gurka_oneways gurka_indoor _valhalla_stub localedef \
            negative_osm_ids valhalla_build_tiles cost_inline_tests tyr_inline_tests \
            2>&1 | tee validation-logs/build.log
          cp src/bindings/python/valhalla/_valhalla.pyi validation-logs/generated-_valhalla.pyi
          git diff --exit-code -- src/bindings/python/valhalla/_valhalla.pyi \
            2>&1 | tee validation-logs/stub-diff.log
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.focused_build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: issue-validation-ccache-${{ runner.os }}-${{ github.sha }}
      - name: Run focused C++ tests
        shell: bash
        run: |
          set -o pipefail
          export LOCPATH="$GITHUB_WORKSPACE/locales"
          cd build
          set +e
          status=0
          for test in test/cost_inline_tests test/tyr_inline_tests \
            test/lua test/maneuversbuilder test/actor test/factory test/map_matcher_factory \
            test/graphtile test/transitdeparture test/gurka/gurka_gtfs test/multimodalbuilder \
            test/openlr test/gurka/gurka_locate test/predictedspeeds test/uniquenames test/gridded_data \
            test/restriction_parser test/negative_osm_ids test/gurka/gurka_simple_restrictions test/thor_worker test/mapmatch \
            test/gurka/gurka_trace_attributes test/gurka/gurka_lane_connectivity \
            test/attributes_controller test/osmnode test/gurka/gurka_vector_tiles \
            test/aabb2 test/edgeinfo test/edgestatus test/elevation_encoding test/encode test/graphreader \
            test/grid_range_query test/grid_traversal test/isochrone test/json test/matrix test/optimizer \
            test/parse_request test/pointll test/polyline2 test/reach test/sample test/sequence test/tar \
            test/tilehierarchy test/util_odin test/gurka/gurka_conditional_restrictions \
            test/gurka/gurka_time_dependent_restrictions test/gurka/gurka_probable_restrictions \
            test/gurka/gurka_elevation test/gurka/gurka_linear_feature_factors test/gurka/gurka_recost \
            test/gurka/gurka_route test/gurka/gurka_time_tracking test/gurka/gurka_use_options \
            test/gurka/gurka_oneways_foot_bike test/gurka/gurka_oneways test/gurka/gurka_indoor; do
            "$test" 2>&1 | tee "../validation-logs/$(basename "$test").log"
            code=${PIPESTATUS[0]}
            printf '%s exit=%s\n' "$test" "$code" | tee -a ../validation-logs/cpp-exit-codes.log
            if (( code != 0 )); then status=1; fi
          done
          exit "$status"
      - name: Upload C++ validation logs
        if: ${{ !cancelled() && steps.focused_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-validation-cpp-logs
          path: validation-logs/
          retention-days: 14
      - name: Run tile builder CLI regression
        if: ${{ !cancelled() && steps.focused_build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python test/negative_osm_ids_cli.py --fixture-generator build/test/negative_osm_ids \
            --build-tiles build/valhalla_build_tiles 2>&1 | tee validation-logs/negative-osm-ids-cli.log
      - name: Run Python binding and script tests
        if: ${{ !cancelled() && steps.focused_build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cd build
          export LOCPATH="$GITHUB_WORKSPACE/locales"
          export PYTHONPATH="$GITHUB_WORKSPACE/build/src/bindings/python"
          status=0
          for suite in actor config predicted_speeds graph_utils; do
            python -m unittest discover -s "$GITHUB_WORKSPACE/test/bindings/python" -p "test_${suite}.py" -v \
              2>&1 | tee "../validation-logs/python-${suite}.log" || status=1
          done
          export PYTHONPATH="$PYTHONPATH:$GITHUB_WORKSPACE/build/src/bindings/python/valhalla"
          for suite in elevation extract; do
            python -m unittest discover -s "$GITHUB_WORKSPACE/test/scripts" -p "test_valhalla_build_${suite}.py" -v \
              2>&1 | tee "../validation-logs/python-script-${suite}.log" || status=1
          done
          exit "$status"
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-validation-logs
          path: validation-logs/
          if-no-files-found: warn
          retention-days: 14
